server:
  port: 8095

spring:
  application:
    name: point-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:3306/point_service?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:truong22022004}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost:9092}
    consumer:
      group-id: point-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437

# Quy tắc điểm thưởng — NGUỒN DUY NHẤT, đổi ở đây là đủ (FE đọc qua GET /api/points/config,
# Order Service để Point Service tự kiểm tra khi redeem):
#   earn-rate:        tích điểm = tỉ lệ này x giá trị gốc (tiền hàng) của đơn, khi đơn DELIVERED
#   max-redeem-ratio: mỗi đơn dùng điểm tối đa bằng tỉ lệ này x tiền hàng (tránh đơn 0đ)
point:
  earn-rate: 0.10
  max-redeem-ratio: 0.50
