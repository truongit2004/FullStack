server:
  port: 8092

spring:
  application:
    name: chat-service
  data:
    mongodb:
      host: ${MONGO_HOST:localhost}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DATABASE:chat_service_db}

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

# JWT — phải dùng cùng secret với AuthService/các service khác.
# ChatService không dùng Spring Security filter: REST tin vào header X-User-* của Gateway,
# còn WebSocket xác thực JWT ở frame STOMP CONNECT (xem StompAuthChannelInterceptor).
