apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secret
type: Opaque
stringData:
  # Mật khẩu root MySQL — dùng cho cả container MySQL lẫn các service
  MYSQL_ROOT_PASSWORD: doi-mat-khau-nay
  SPRING_DATASOURCE_PASSWORD: doi-mat-khau-nay
  # VNPay
  VNP_TMNCODE: ma-tmn
  VNP_HASHSECRET: chuoi-bi-mat
  # Gmail gửi thông báo (App Password)
  SPRING_MAIL_USERNAME: email@gmail.com
  SPRING_MAIL_PASSWORD: app-password
