# product-service — cổng 8082, database MySQL "product_service"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels:
    app: product-service
    tier: service
spec:
  replicas: 1
  # GIỮ 1 BẢN: Ổ đĩa ảnh sản phẩm là ReadWriteOnce và job khuyến mãi ngày lễ (@Scheduled) chỉ được chạy ở 1 bản.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
        tier: service
    spec:
      # Tắt việc Kubernetes tự chèn biến kiểu REDIS_PORT=tcp://10.x.x.x:6379 cho mỗi Service:
      # các biến đó trùng tên với biến mà application.yml của dự án đang đọc và làm hỏng cấu hình.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 40
      containers:
        - name: product-service
          image: ecommerce/product-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: ecommerce-config
            - secretRef:
                name: ecommerce-secret
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/product_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              memory: 640Mi
          # Dự án chưa có spring-boot-starter-actuator nên dùng kiểm tra cổng TCP.
          # startupProbe cho ứng dụng tối đa 5 phút để khởi động trước khi bị coi là hỏng.
          startupProbe:
            tcpSocket:
              port: 8082
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 8082
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8082
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              # Chờ Eureka và Gateway ngừng gửi request tới pod này rồi mới tắt
              exec:
                command: ["sleep", "15"]
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads/products
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: product-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  labels:
    app: product-service
spec:
  selector:
    app: product-service
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: product-uploads
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
