# review-service — cổng 8091, database MySQL "review_service_db"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
  labels:
    app: review-service
    tier: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
        tier: service
    spec:
      # Tắt việc Kubernetes tự chèn biến kiểu REDIS_PORT=tcp://10.x.x.x:6379 cho mỗi Service:
      # các biến đó trùng tên với biến mà application.yml của dự án đang đọc và làm hỏng cấu hình.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 40
      containers:
        - name: review-service
          image: ecommerce/review-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8091
          envFrom:
            - configMapRef:
                name: ecommerce-config
            - secretRef:
                name: ecommerce-secret
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/review_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              memory: 640Mi
          # Dự án chưa có spring-boot-starter-actuator nên dùng kiểm tra cổng TCP.
          # startupProbe cho ứng dụng tối đa 5 phút để khởi động trước khi bị coi là hỏng.
          startupProbe:
            tcpSocket:
              port: 8091
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 8091
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8091
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              # Chờ Eureka và Gateway ngừng gửi request tới pod này rồi mới tắt
              exec:
                command: ["sleep", "15"]
---
apiVersion: v1
kind: Service
metadata:
  name: review-service
  labels:
    app: review-service
spec:
  selector:
    app: review-service
  ports:
    - port: 8091
      targetPort: 8091
