server:
  port: 8085

spring:
  application:
    name: API-Gateway
  codec:
    max-in-memory-size: 15MB
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            # Dùng pattern (không dùng allowedOrigins: "*") vì "*" không được phép đi cùng allowCredentials
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      # Chat Service (SockJS) tự gắn header CORS; Gateway cũng gắn -> bị trùng, trình duyệt từ chối.
      # Giữ lại 1 giá trị cho mỗi header.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
        # Service đích vừa chết hoặc đang khởi động lại: thử lại tối đa 2 lần (mỗi lần cân bằng tải chọn lại bản chạy).
        # CHỈ áp dụng cho GET — thử lại POST/PUT/DELETE có thể làm một thao tác chạy 2 lần.
        - name: Retry
          args:
            retries: 2
            methods: GET
            statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
            backoff:
              firstBackoff: 200ms
              maxBackoff: 1s
              factor: 2
      # Không chờ service đích vô thời hạn: 3 giây để kết nối, 30 giây chờ phản hồi (quá thì trả 504)
      httpclient:
        connect-timeout: 3000
        response-timeout: 30s
      routes:
        - id: cart-service
          uri: lb://CartService
          predicates:
            - Path=/api/cart/**

        - id: product-service-get
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**, /api/categories/**
            - Method=GET
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 1
                key-resolver: "#{@userKeyResolver}"

        - id: product-service-other
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**, /api/categories/**
            - Method=POST, PUT, DELETE, PATCH

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payment/**

        - id: chat-service
          uri: lb://CHAT-SERVICE
          predicates:
            - Path=/ws/**, /api/chat/**
          # Kết nối chat (WebSocket / SockJS) được giữ lâu: không áp giới hạn 30 giây chờ phản hồi
          metadata:
            response-timeout: -1

        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/reviews/**

        - id: shipping-service
          uri: lb://shipping-service
          predicates:
            - Path=/api/shipping/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/api/search/**

        - id: point-service
          uri: lb://point-service
          predicates:
            - Path=/api/points/**

        - id: coupon-service
          uri: lb://coupon-service
          predicates:
            - Path=/api/coupons/**

  # Redis Configuration for Rate Limiting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    # Cập nhật danh sách service từ Eureka mỗi 10 giây (mặc định 30) để sớm bỏ bản đã chết
    registry-fetch-interval-seconds: 10

# JWT Configuration (Shared with other services)
jwt:
  secret: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
  expiration: 86400000
