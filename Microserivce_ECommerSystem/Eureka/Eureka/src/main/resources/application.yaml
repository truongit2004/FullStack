server:
  port: 8761

spring:
  application:
    name: EUREKA-SERVER

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false # tắt chế độ bảo vệ
    # Quét và loại bản chạy đã hết hạn mỗi 10 giây (mặc định 60 giây)
    eviction-interval-timer-in-ms: 10000
    # Danh sách trả cho client được làm mới mỗi 5 giây (mặc định 30 giây)
    response-cache-update-interval-ms: 5000
